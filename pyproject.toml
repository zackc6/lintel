[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lintel"
version = "0.1.0"
description = "Admit-and-freeze control plane contract (plan artifact, not a shipped package)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.22",
]

[project.scripts]
lintel-validate = "lintel.schema:main"

[tool.setuptools.packages.find]
where = ["src"]
